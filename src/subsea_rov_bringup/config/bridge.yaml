# ros_gz_bridge mappings.
#   Gazebo -> ROS : clock, IMU, magnetometer, ground-truth odometry
#   ROS -> Gazebo : 8 thruster force commands (N), ocean current (m/s, world),
#                   external wrench for disturbance tests
# The DVL is relayed by subsea_rov_sensors/dvl_bridge (no bridge mapping exists).
# Ground truth feeds only the sensor models and the validation recorder.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /rov/imu/data
  gz_topic_name: /model/dummy_rov/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /rov/imu/mag
  gz_topic_name: /model/dummy_rov/magnetometer
  ros_type_name: sensor_msgs/msg/MagneticField
  gz_type_name: gz.msgs.Magnetometer
  direction: GZ_TO_ROS
- ros_topic_name: /rov/ground_truth/odom
  gz_topic_name: /model/dummy_rov/ground_truth/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /rov/thrusters/fl/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_fl_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/fr/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_fr_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/bl/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_bl_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/br/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_br_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/fl_top/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_fl_top_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/fr_top/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_fr_top_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/bl_top/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_bl_top_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /rov/thrusters/br_top/cmd
  gz_topic_name: /model/dummy_rov/joint/thruster_br_top_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /ocean_current
  gz_topic_name: /ocean_current
  ros_type_name: geometry_msgs/msg/Vector3
  gz_type_name: gz.msgs.Vector3d
  direction: ROS_TO_GZ
- ros_topic_name: /world/default/wrench/persistent
  gz_topic_name: /world/default/wrench/persistent
  ros_type_name: ros_gz_interfaces/msg/EntityWrench
  gz_type_name: gz.msgs.EntityWrench
  direction: ROS_TO_GZ
- ros_topic_name: /world/default/wrench/clear
  gz_topic_name: /world/default/wrench/clear
  ros_type_name: ros_gz_interfaces/msg/Entity
  gz_type_name: gz.msgs.Entity
  direction: ROS_TO_GZ
